<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=13.65.5">

<style>
/* Заставка при входе — как в приложении (вариант B): тёмный фон в цветах значка (бордо слева сверху, синий справа снизу),
   знак AV проступает из размытия и вспыхивает, надпись ALBAKOV выезжает слева.
   Когда магазин готов, сайт раскрывается кругом от знака. Показывается сразу, ещё до загрузки стилей и скриптов магазина. */
html{background:#ffffff}
@property --spr{syntax:'<length>';inherits:false;initial-value:0px}
#splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;--spr:0px;
  background:radial-gradient(420px 420px at -10% -5%,rgba(130,31,53,.95),transparent 100%),radial-gradient(460px 460px at 110% 105%,rgba(58,120,183,.75),transparent 100%),#121419;
  -webkit-mask:radial-gradient(circle at 50% 46%,transparent var(--spr),#000 calc(var(--spr) + 1px));mask:radial-gradient(circle at 50% 46%,transparent var(--spr),#000 calc(var(--spr) + 1px));
  transition:--spr .75s cubic-bezier(.6,0,.2,1)}
#splash .sp{display:grid;justify-items:center;gap:26px;margin-top:-40px}
#splash .sp-mark{width:96px;height:auto;filter:brightness(0) invert(1);animation:spMark .9s cubic-bezier(.2,.7,.2,1) both,spGlow .7s .7s ease-in-out both}
#splash .sp-word{width:170px;height:auto;filter:brightness(0) invert(1);animation:spWord .7s .35s cubic-bezier(.3,.7,.2,1) both}
#splash.leave{--spr:150vmax}
@keyframes spMark{from{opacity:0;transform:scale(1.18);filter:brightness(0) invert(1) blur(14px)}to{opacity:1;transform:none;filter:brightness(0) invert(1) blur(0)}}
@keyframes spGlow{to{filter:brightness(0) invert(1) drop-shadow(0 0 22px rgba(255,255,255,.45))}}
@keyframes spWord{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash{transition:opacity .3s ease;-webkit-mask:none;mask:none}#splash.leave{opacity:0}}
/* при обновлении страницы и в панели заставки нет (js/splash.js) */
.sp-skip #splash{display:none}
.js #app>.pre-nav,.js #app>.pre{display:none}
</style>
<script src="js/splash.js?v=13.65.5"></script>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp"><img class="sp-mark" src="img/logo-mark.png" alt="" width="64" height="56"><img class="sp-word" src="img/logo-wordmark.png" alt="" width="132" height="13"></div></div>
<div id="app"></div>
<script src="js/pricing.js?v=13.65.5"></script>

<script src="js/metrika.js?v=13.65.5"></script>
<script src="js/app.js?v=13.65.5"></script>
<script src="js/ptr.js?v=13.65.5"></script>
</body>
</html>
