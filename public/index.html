<style>
/* Заставка при входе: показывается сразу, ещё до загрузки стилей и скриптов магазина.
   Знак AV прорисовывается слева направо, под ним надпись и тонкая линия загрузки.
   Когда магазин готов, линия дотягивается до конца, и заставка уезжает вверх, как занавес. */
html{background:#ffffff}
#splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#ffffff;transition:transform .85s cubic-bezier(.76,0,.24,1)}
#splash .sp{display:grid;justify-items:center;transition:opacity .35s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
#splash .sp-mark{width:64px;height:auto;animation:spMark 1.05s cubic-bezier(.65,0,.35,1) both}
#splash .sp-word{width:132px;height:auto;margin-top:22px;animation:spWord .9s .4s cubic-bezier(.2,.7,.2,1) both}
#splash .sp-line{position:relative;width:132px;height:1px;margin-top:26px;background:rgba(20,20,20,.12);overflow:hidden;animation:spFade .6s .55s both}
#splash .sp-line i{position:absolute;inset:0;background:#141414;transform-origin:left;transform:scaleX(0);animation:spLoad 2.6s .6s cubic-bezier(.25,.7,.3,1) forwards}
#splash.done .sp-line i{animation:none;transform:scaleX(1);transition:transform .28s ease}
#splash.leave{transform:translateY(-100%)}
#splash.leave .sp{opacity:0;transform:translateY(-28px)}
@keyframes spMark{from{clip-path:inset(0 100% 0 0);transform:scale(.96)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes spWord{from{opacity:0;transform:translateY(8px)}}
@keyframes spFade{from{opacity:0}}
@keyframes spLoad{to{transform:scaleX(.82)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash{transition:opacity .3s ease}#splash.leave{transform:none;opacity:0}}
/* при обновлении страницы и в панели заставки нет (js/splash.js) */
.sp-skip #splash{display:none}
</style>
