<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body><canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform int uIcon;
out vec4 outColor;

#define PI 3.14159265

// ---------- materials (sRGB) ----------
vec3 srgb(vec3 c) { return pow(c, vec3(2.2)); }
vec3 matColor(float m, vec3 p) {
  if (m < 0.5) return srgb(vec3(0.243, 0.420, 0.941));      // 0 blue
  if (m < 1.5) return srgb(vec3(0.133, 0.188, 0.290));      // 1 dark glass
  if (m < 2.5) return srgb(vec3(0.173, 0.192, 0.220));      // 2 graphite
  if (m < 3.5) return srgb(vec3(0.800, 0.830, 0.870));      // 3 silver
  if (m < 4.5) return srgb(vec3(1.000, 0.790, 0.290));      // 4 yellow
  if (m < 5.5) return srgb(vec3(0.970, 0.975, 0.985));      // 5 white
  if (m < 6.5) return srgb(vec3(1.000, 0.545, 0.455));      // 6 coral
  if (m < 7.5) return srgb(vec3(0.133, 0.710, 0.451));      // 7 green
  if (m < 8.5) return srgb(vec3(0.850, 0.627, 0.400));      // 8 kraft
  if (m < 9.5) return srgb(vec3(0.945, 0.867, 0.706));      // 9 tape
  if (m < 10.5) return srgb(vec3(0.482, 0.380, 1.000));     // 10 violet
  if (m < 11.5) {                                           // 11 card gradient teal -> blue
    float t = clamp(p.x * 0.6 + 0.5, 0.0, 1.0);
    return mix(srgb(vec3(0.086, 0.710, 0.647)), srgb(vec3(0.243, 0.420, 0.941)), t);
  }
  if (m < 12.5) return srgb(vec3(0.929, 0.725, 0.294));     // 12 gold
  if (m < 13.5) return srgb(vec3(0.941, 0.345, 0.486));     // 13 pink
  if (m < 14.5) return srgb(vec3(0.102, 0.698, 0.282));     // 14 delivery green
  if (m < 15.5) return srgb(vec3(0.788, 0.573, 0.369));     // 15 camel wool
  if (m < 16.5) return srgb(vec3(0.227, 0.259, 0.322));     // 16 navy wool
  return srgb(vec3(0.5));
}
float matGloss(float m) {
  if (m > 14.5 && m < 16.5) return 0.08;  // wool — matte
  if (m > 0.5 && m < 1.5) return 1.0;   // glass
  if (m > 2.5 && m < 3.5) return 0.9;   // silver
  if (m > 11.5 && m < 12.5) return 0.85; // gold
  if (m > 7.5 && m < 9.5) return 0.15;  // kraft, tape — matte
  return 0.45;
}

// ---------- primitives ----------
float sdRoundBox(vec3 p, vec3 b, float r) { vec3 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r; }
float sdRoundCylZ(vec3 p, float ra, float h, float rb) { // axis along z
  vec2 d = vec2(length(p.xy) - ra + rb, abs(p.z) - h + rb);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - rb;
}
float sdCapsule(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float sdCappedTorus(vec3 p, vec2 sc, float ra, float rb) { p.x = abs(p.x); float k = (sc.y * p.x > sc.x * p.y) ? dot(p.xy, sc) : length(p.xy); return sqrt(dot(p, p) + ra * ra - 2.0 * ra * k) - rb; }
float sdTorusXY(vec3 p, float ra, float rb) { vec2 q = vec2(length(p.xy) - ra, p.z); return length(q) - rb; }
float sdBox2(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float sdTri2(vec2 p, vec2 p0, vec2 p1, vec2 p2) {
  vec2 e0 = p1 - p0, e1 = p2 - p1, e2 = p0 - p2, v0 = p - p0, v1 = p - p1, v2 = p - p2;
  vec2 pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  vec2 pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  vec2 pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  float s = sign(e0.x * e2.y - e0.y * e2.x);
  vec2 d = min(min(vec2(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)), vec2(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))), vec2(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
float extrude(float d2, float pz, float h) { vec2 w = vec2(d2, abs(pz) - h); return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float smax(float a, float b, float k) { return -smin(-a, -b, k); }
vec2 U(vec2 a, vec2 b) { return a.x < b.x ? a : b; }

// ---------- scenes ----------
vec2 truck(vec3 p) {
  vec2 r = vec2(1e5, 0.0);
  vec3 q = p; q.z = abs(q.z);
  r = U(r, vec2(sdRoundBox(p - vec3(-0.30, 0.74, 0.0), vec3(0.74, 0.46, 0.46), 0.13), 5.0));          // cargo, white
  r = U(r, vec2(sdRoundBox(p - vec3(0.70, 0.60, 0.0), vec3(0.30, 0.32, 0.44), 0.13), 14.0));           // cab, green
  r = U(r, vec2(sdRoundBox(p - vec3(0.985, 0.72, 0.0), vec3(0.03, 0.12, 0.33), 0.03), 1.0));           // windshield
  r = U(r, vec2(sdRoundBox(q - vec3(0.74, 0.72, 0.44), vec3(0.15, 0.12, 0.02), 0.02), 1.0));            // side windows
  r = U(r, vec2(sdRoundBox(p - vec3(-0.30, 0.46, 0.0), vec3(0.755, 0.115, 0.468), 0.05), 14.0));         // wide green band
  r = U(r, vec2(sdRoundBox(p - vec3(-0.30, 0.66, 0.0), vec3(0.755, 0.028, 0.468), 0.02), 14.0));          // thin green line
  r = U(r, vec2(length(q - vec3(0.985, 0.42, 0.31)) - 0.06, 4.0));                                       // headlights
  r = U(r, vec2(sdRoundBox(p - vec3(0.15, 0.27, 0.0), vec3(1.0, 0.07, 0.34), 0.04), 2.0));              // chassis
  vec3 w1 = q - vec3(-0.66, 0.22, 0.40), w2 = q - vec3(0.66, 0.22, 0.40);
  r = U(r, vec2(min(sdRoundCylZ(w1, 0.22, 0.09, 0.05), sdRoundCylZ(w2, 0.22, 0.09, 0.05)), 2.0));       // tyres
  r = U(r, vec2(min(sdRoundCylZ(w1 - vec3(0, 0, 0.03), 0.1, 0.075, 0.03), sdRoundCylZ(w2 - vec3(0, 0, 0.03), 0.1, 0.075, 0.03)), 3.0)); // hubs
  return r;
}
vec2 fitting(vec3 p) {
  vec2 r = vec2(1e5, 0.0);
  vec2 s = p.xy; s.x = abs(s.x);
  float body = sdBox2(s - vec2(0.0, 0.86), vec2(0.50, 0.66), 0.12);
  float shoulders = sdBox2(s - vec2(0.0, 1.38), vec2(0.60, 0.16), 0.12);
  vec2 sl = s - vec2(0.70, 1.20); sl = rot(0.62) * sl;
  float sleeve = sdBox2(sl, vec2(0.22, 0.24), 0.10);
  float d2 = smin(smin(body, shoulders, 0.12), sleeve, 0.10);
  d2 = smax(d2, -(length(s - vec2(0.0, 1.60)) - 0.22), 0.06);              // neckline
  float tee = extrude(d2, p.z, 0.10) - 0.07;
  r = U(r, vec2(tee, 6.0));
  // collar rim
  vec3 cp = p - vec3(0.0, 1.60, 0.0);
  float collar = sdCappedTorus(vec3(cp.x, -cp.y, cp.z * 0.9), vec2(sin(1.25), cos(1.25)), 0.25, 0.05);
  r = U(r, vec2(collar, 6.0));
  // hanger hook
  r = U(r, vec2(sdCapsule(p, vec3(0.0, 1.56, 0.0), vec3(0.0, 1.88, 0.0), 0.04), 3.0));
  vec3 hp = p - vec3(0.0, 2.04, 0.0); hp.xy = rot(-0.9) * hp.xy;
  r = U(r, vec2(sdCappedTorus(hp, vec2(sin(2.1), cos(2.1)), 0.16, 0.04), 3.0));
  // check badge
  vec3 bp = p - vec3(0.52, 0.52, 0.30);
  r = U(r, vec2(sdRoundCylZ(bp, 0.36, 0.09, 0.06), 7.0));
  vec3 kp = bp - vec3(0.0, 0.0, 0.10);
  float chk = min(sdCapsule(kp, vec3(-0.16, 0.01, 0.0), vec3(-0.05, -0.11, 0.0), 0.05), sdCapsule(kp, vec3(-0.05, -0.11, 0.0), vec3(0.17, 0.13, 0.0), 0.05));
  r = U(r, vec2(chk, 5.0));
  return r;
}
vec2 returns(vec3 p) {
  vec2 r = vec2(1e5, 0.0);
  r = U(r, vec2(sdRoundBox(p - vec3(0.0, 0.56, 0.0), vec3(0.64, 0.54, 0.56), 0.09), 8.0));             // box
  r = U(r, vec2(sdRoundBox(p - vec3(0.0, 1.02, 0.0), vec3(0.17, 0.095, 0.578), 0.02), 9.0));            // tape over the top edge
  // circular arrow in front of the box
  vec3 ap = p - vec3(0.0, 0.58, 0.80);
  vec3 lp = ap; lp.xy = rot(2.356) * lp.xy;  // rotate so arc axis points to lower-left (gap at upper-right)
  float arc = sdCappedTorus(lp, vec2(sin(2.53), cos(2.53)), 0.37, 0.10);
  float ang = radians(80.0);
  vec2 E = 0.37 * vec2(cos(ang), sin(ang));
  vec2 rad = vec2(cos(ang), sin(ang)), tng = vec2(-sin(ang), cos(ang));
  float head2 = sdTri2(ap.xy, E + rad * 0.24, E - rad * 0.24, E + tng * 0.30) - 0.025;
  float head = extrude(head2, ap.z, 0.075) - 0.025;
  r = U(r, vec2(smin(arc, head, 0.04), 10.0));
  return r;
}
vec2 payment(vec3 p) {
  vec2 r = vec2(1e5, 0.0);
  // back card
  vec3 b = p - vec3(0.20, 0.98, -0.30); b.yz = rot(0.35) * b.yz; b.xy = rot(-0.12) * b.xy;
  r = U(r, vec2(sdRoundBox(b, vec3(0.82, 0.52, 0.045), 0.06), 10.0));
  // front card
  vec3 c = p - vec3(-0.05, 0.70, 0.12); c.yz = rot(0.35) * c.yz; c.xy = rot(0.10) * c.xy;
  r = U(r, vec2(sdRoundBox(c, vec3(0.86, 0.54, 0.05), 0.07), 11.0));
  r = U(r, vec2(sdRoundBox(c - vec3(-0.47, 0.12, 0.05), vec3(0.15, 0.115, 0.025), 0.04), 12.0));   // chip
  r = U(r, vec2(sdRoundBox(c - vec3(-0.18, -0.28, 0.05), vec3(0.50, 0.035, 0.012), 0.012), 5.0));   // number line
  r = U(r, vec2(sdRoundBox(c - vec3(-0.40, -0.40, 0.05), vec3(0.28, 0.028, 0.012), 0.012), 5.0));   // name line
  vec3 lg = c - vec3(0.52, 0.30, 0.05);                                                              // logo circles
  r = U(r, vec2(min(sdRoundCylZ(lg - vec3(-0.07, 0, 0), 0.11, 0.02, 0.015), sdRoundCylZ(lg - vec3(0.07, 0, 0), 0.11, 0.02, 0.015)), 5.0));
  return r;
}
vec2 gift(vec3 p) {
  vec2 r = vec2(1e5, 0.0);
  r = U(r, vec2(sdRoundBox(p - vec3(0.0, 0.45, 0.0), vec3(0.55, 0.45, 0.55), 0.07), 13.0));          // base
  r = U(r, vec2(sdRoundBox(p - vec3(0.0, 0.98, 0.0), vec3(0.62, 0.13, 0.62), 0.06), 13.0));          // lid
  r = U(r, vec2(sdRoundBox(p - vec3(0.0, 0.45, 0.0), vec3(0.11, 0.455, 0.565), 0.02), 12.0));        // ribbons on base
  r = U(r, vec2(sdRoundBox(p - vec3(0.0, 0.45, 0.0), vec3(0.565, 0.455, 0.11), 0.02), 12.0));
  r = U(r, vec2(sdRoundBox(p - vec3(0.0, 0.98, 0.0), vec3(0.12, 0.135, 0.632), 0.03), 12.0));        // ribbons on lid
  r = U(r, vec2(sdRoundBox(p - vec3(0.0, 0.98, 0.0), vec3(0.632, 0.135, 0.12), 0.03), 12.0));
  vec3 bw = p - vec3(0.0, 1.17, 0.0); bw.x = abs(bw.x);
  vec3 l = bw - vec3(0.19, 0.08, 0.0); l.xy = rot(-0.55) * l.xy;
  float bow = sdTorusXY(vec3(l.x / 1.15, l.y, l.z), 0.15, 0.055);
  r = U(r, vec2(min(bow, length(bw - vec3(0.0, 0.03, 0.0)) - 0.09), 12.0));
  return r;
}

float sdStar5(vec2 p, float r, float rf) {
  const vec2 k1 = vec2(0.809016994375, -0.587785252292); const vec2 k2 = vec2(-k1.x, k1.y);
  p.x = abs(p.x); p -= 2.0 * max(dot(k1, p), 0.0) * k1; p -= 2.0 * max(dot(k2, p), 0.0) * k2; p.x = abs(p.x); p.y -= r;
  vec2 ba = rf * vec2(-k1.y, k1.x) - vec2(0, 1); float h = clamp(dot(p, ba) / dot(ba, ba), 0.0, r);
  return length(p - ba * h) * sign(p.y * ba.x - p.x * ba.y);
}
vec2 quality(vec3 p) {
  vec2 r = vec2(1e5, 0.0);
  vec3 m = p - vec3(0.0, 1.02, 0.0);
  float ang = atan(m.y, m.x);
  float rim2 = length(m.xy) - (0.54 + 0.032 * cos(14.0 * ang));
  r = U(r, vec2((extrude(rim2, m.z, 0.06) - 0.03) * 0.8, 12.0));                 // scalloped gold seal
  r = U(r, vec2(sdRoundCylZ(m - vec3(0.0, 0.0, 0.07), 0.40, 0.035, 0.02), 5.0));     // white face
  r = U(r, vec2(sdTorusXY(m - vec3(0.0, 0.0, 0.10), 0.40, 0.028), 12.0));            // gold ring
  float st = sdStar5(m.xy - vec2(0.0, -0.01), 0.26, 0.46) - 0.025;
  r = U(r, vec2(extrude(st, m.z - 0.11, 0.045) - 0.02, 12.0));                       // gold star
  vec2 q = p.xy; q.x = abs(q.x);
  vec2 rb = rot(-0.32) * (q - vec2(0.24, 0.36));
  float tail = sdBox2(rb, vec2(0.15, 0.36), 0.03);
  tail = max(tail, -sdTri2(rb, vec2(-0.16, -0.37), vec2(0.16, -0.37), vec2(0.0, -0.22)));
  r = U(r, vec2(extrude(tail, p.z + 0.06, 0.03) - 0.015, 0.0));                     // blue ribbons
  return r;
}
vec2 fabric(vec3 p) {
  vec2 r = vec2(1e5, 0.0);
  vec3 a = p - vec3(0.02, 0.11, 0.0); a.xz = rot(0.06) * a.xz;
  r = U(r, vec2(sdRoundBox(a, vec3(0.66, 0.10, 0.44), 0.095), 16.0));             // navy wool
  vec3 b = p - vec3(-0.04, 0.315, 0.02); b.xz = rot(-0.07) * b.xz;
  r = U(r, vec2(sdRoundBox(b, vec3(0.62, 0.10, 0.42), 0.095), 15.0));             // camel wool
  vec3 c = p - vec3(0.03, 0.52, -0.01); c.xz = rot(0.04) * c.xz;
  r = U(r, vec2(sdRoundBox(c, vec3(0.58, 0.10, 0.40), 0.095), 9.0));              // cream cotton
  vec3 rl = p - vec3(0.0, 0.81, 0.02); rl.xz = rot(0.18) * rl.xz;
  r = U(r, vec2(sdRoundCylZ(rl.zyx, 0.19, 0.50, 0.05), 6.0));                       // fabric roll
  r = U(r, vec2(sdRoundCylZ(rl.zyx, 0.06, 0.53, 0.02), 8.0));                       // cardboard core
  r = U(r, vec2(sdRoundBox(c - vec3(0.36, 0.0, 0.41), vec3(0.10, 0.065, 0.012), 0.02), 12.0)); // gold tag
  return r;
}

float yawFor() { return uIcon == 0 ? 0.0 : uIcon == 1 ? 0.62 : uIcon == 2 ? 0.40 : uIcon == 3 ? 0.55 : uIcon == 4 ? 0.30 : uIcon == 5 ? 0.62 : 0.35; }
vec2 map(vec3 p) {
  p.xz = rot(-yawFor()) * p.xz;
  if (uIcon == 0) return truck(p);
  if (uIcon == 1) return fitting(p);
  if (uIcon == 2) return returns(p);
  if (uIcon == 3) return payment(p);
  if (uIcon == 4) return gift(p);
  if (uIcon == 5) return quality(p);
  return fabric(p);
}
vec3 calcNormal(vec3 p) {
  const float h = 0.0008; const vec2 k = vec2(1, -1);
  return normalize(k.xyy * map(p + k.xyy * h).x + k.yyx * map(p + k.yyx * h).x + k.yxy * map(p + k.yxy * h).x + k.xxx * map(p + k.xxx * h).x);
}
float softShadow(vec3 ro, vec3 rd, float k) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 64; i++) { float h = map(ro + rd * t).x; res = min(res, k * h / t); t += clamp(h, 0.01, 0.2); if (res < 0.001 || t > 6.0) break; }
  return clamp(res, 0.0, 1.0);
}
float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 6; i++) { float h = 0.02 + 0.09 * float(i); occ += (h - map(p + n * h).x) * sca; sca *= 0.8; }
  return clamp(1.0 - 1.4 * occ, 0.0, 1.0);
}

void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
  vec3 ta = vec3(0.0, uIcon == 1 ? 1.05 : 0.62, 0.0);
  vec3 ro = ta + normalize(vec3(1.0, 0.62, 1.25)) * 9.0;
  vec3 ww = normalize(ta - ro), uu = normalize(cross(ww, vec3(0, 1, 0))), vv = cross(uu, ww);
  vec3 rd = normalize(uv.x * uu + uv.y * vv + 3.8 * ww);

  vec3 L = normalize(vec3(-0.55, 1.0, 0.65));
  vec3 F = normalize(vec3(1.0, 0.35, 0.4));
  float t = 0.0; vec2 h = vec2(0.0); bool hit = false;
  for (int i = 0; i < 220; i++) { h = map(ro + rd * t); if (abs(h.x) < 0.0004 * t) { hit = true; break; } t += h.x; if (t > 20.0) break; }

  if (hit) {
    vec3 p = ro + rd * t, n = calcNormal(p);
    vec3 lp = p; lp.xz = rot(-yawFor()) * lp.xz;
    vec3 alb = matColor(h.y, lp);
    float gl = matGloss(h.y);
    float ao = calcAO(p, n);
    float dif = clamp(dot(n, L), 0.0, 1.0) * softShadow(p + n * 0.003, L, 10.0);
    float fil = clamp(dot(n, F), 0.0, 1.0);
    float sky = 0.55 + 0.45 * n.y;
    float bou = clamp(-n.y, 0.0, 1.0);
    vec3 hv = normalize(L - rd);
    float fre = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 4.0);
    float spe = pow(clamp(dot(n, hv), 0.0, 1.0), mix(16.0, 90.0, gl)) * dif * (0.04 + 0.96 * fre * 0.5 + 0.25) * mix(0.35, 1.6, gl);
    vec3 col = alb * (0.58 * sky * ao * vec3(0.93, 0.96, 1.04) + 1.0 * dif * vec3(1.0, 0.97, 0.92) + 0.42 * fil * ao * vec3(0.96, 0.97, 1.0) + 0.14 * bou * ao);
    col += spe * vec3(1.0);
    col += fre * 0.22 * ao * vec3(0.9, 0.95, 1.0) * mix(0.6, 1.2, gl);
    col = col / (1.0 + col * 0.12);
    col = pow(col, vec3(1.0 / 2.2));
    outColor = vec4(col, 1.0);
  } else {
    // soft contact shadow on an invisible floor
    float tg = -ro.y / rd.y;
    if (rd.y < 0.0 && tg > 0.0) {
      vec3 g = ro + rd * tg;
      float sh = 1.0 - softShadow(g + vec3(0, 0.001, 0), normalize(vec3(-0.15, 1.0, 0.15)), 3.0);
      float ao = 1.0 - calcAO(g, vec3(0, 1, 0));
      float a = clamp(sh * 0.26 + ao * 0.40, 0.0, 0.5);
      vec3 sc = vec3(0.10, 0.12, 0.17);
      outColor = vec4(sc * a, a);
    } else outColor = vec4(0.0);
  }
}
</script>
<script>
function render(icon, size) {
  var c = document.getElementById('c'); c.width = size; c.height = size;
  var gl = c.getContext('webgl2', { premultipliedAlpha: true, preserveDrawingBuffer: true, alpha: true });
  var vs = '#version 300 es\nin vec2 a; void main(){ gl_Position = vec4(a,0,1); }';
  function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
  var pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent.trim()));
  gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
